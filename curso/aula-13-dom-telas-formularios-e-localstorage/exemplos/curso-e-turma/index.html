<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso e turma</title>
    <script src="curso-e-turma.js" defer></script>
</head>
<body>
    <h1>Um select que muda outro select</h1>
    <form id="form-escolha">
        <p><label for="curso">Curso</label> <select id="curso"></select></p>
        <p><label for="turma">Turma</label> <select id="turma"></select></p>
        <button type="submit">Confirmar</button>
    </form>
    <p id="mensagem" role="status"></p>
</body>
</html>
