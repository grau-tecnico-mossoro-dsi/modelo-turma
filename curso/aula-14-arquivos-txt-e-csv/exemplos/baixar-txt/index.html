<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar um .txt</title>
    <script src="baixar.js" defer></script>
</head>
<body>
    <h1>Gerar e baixar um .txt</h1>
    <form id="form-frase">
        <p>
            <label for="frase">Frase</label>
            <input id="frase">
        </p>
        <button type="submit">Baixar frase.txt</button>
    </form>
    <p>
        <button type="button" id="btn-tabela">Baixar tabela de notas (padEnd / padStart)</button>
    </p>
    <p id="mensagem"></p>
</body>
</html>
